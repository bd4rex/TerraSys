server {
  listen 80;
  server_name _;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  resolver 127.0.0.11 valid=10s ipv6=off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org https://services.arcgisonline.com https://tile.opentopomap.org; font-src 'self'; connect-src 'self' https://tile.openstreetmap.org https://tiles.openfreemap.org https://services.arcgisonline.com https://tile.opentopomap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    try_files /index.html =404;
  }

  location /web/ {
    return 301 /;
  }

  location ~ /\. {
    deny all;
  }

  location /tiles/ {
    alias /srv/pmtiles/;
    add_header Cache-Control "public, max-age=3600";
    add_header Accept-Ranges bytes;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
  }

  location /wiki/ {
    set $kiwix_upstream http://kiwix:8080;
    proxy_pass $kiwix_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /osm-carto/ {
    set $osm_carto_upstream http://osm-carto:80;
    rewrite ^/osm-carto/(.*)$ /$1 break;
    proxy_pass $osm_carto_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_cache_control;
    proxy_connect_timeout 5s;
    proxy_read_timeout 100s;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location /config/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location /vendor/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location /src/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location /martin/ {
    proxy_pass http://martin:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /martin;
  }
}
