name: Test suite

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Static repository contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run static test profile
        shell: pwsh
        run: ./tests/run-suite.ps1 -Profile static
      - name: Validate Linux entry points
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for script in terrasys.sh scripts/install-linux-service.sh scripts/linux/curl.exe; do
            bash -n "$script"
          done
          test -x terrasys.sh
          test -x scripts/install-linux-service.sh
          test -x scripts/linux/curl.exe
